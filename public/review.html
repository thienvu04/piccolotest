<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F5C5E" />
  <meta name="robots" content="noindex" />
  <title>Your review</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .g-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
    .g-hero { background: var(--primary); color: #fff; padding: 28px 16px 56px; text-align: center; }
    .g-hero .r { font-size: 13px; letter-spacing: .12em; font-weight: 600; opacity: .85; text-transform: uppercase; }
    .g-hero h1 { margin-top: 6px; font-size: 26px; }
    .g-card { margin-top: -36px; }
    .steps { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
    .steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
    .steps b.n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; display: grid; place-items: center; }
    .stars { color: var(--accent); font-size: 22px; letter-spacing: 2px; }
    .foot { text-align: center; margin-top: 20px; }
    .big-icon { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header class="g-hero"><div class="r" id="rname">&nbsp;</div><h1 id="title">Loading your review…</h1></header>
  <main class="g-wrap"><div class="card g-card" id="body" aria-live="polite"><p class="small">One moment…</p></div>
    <p class="foot small">Sent with Piccolo on behalf of the restaurant. You don't need an account.</p></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/review.js"></script>
</body>
</html>
